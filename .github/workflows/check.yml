name: Check

# Typecheck, lint and test. Used by ci.yml and before every production deploy.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # Every job runs on the self-hosted runner, pull requests from forks too.
    # A pull request can change this file, so before approving a run from an
    # outside contributor, check that it doesn't touch .github/.
    # The repo requires approval for runs from all outside contributors.
    runs-on: nexus-runner
    timeout-minutes: 15
    steps:
      # Pinned to commits, not tags: a moved tag would run new code on our runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GitHub token in .git/config while package install
          # scripts run.
          persist-credentials: false

      # Node 24 runs the tools (wrangler, vitest, eslint, tsc); Bun installs
      # packages and runs the scripts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # Bun version comes from "packageManager" in package.json.

      - run: bun install --frozen-lockfile

      - name: Generated Worker types are up to date
        run: bun run typegen:check

      - run: bun run typecheck

      - run: bun run lint

      # `bun run test` runs Vitest. `bun test` would run Bun's own test runner.
      - run: bun run test
