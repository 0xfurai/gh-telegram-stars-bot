name: Check

# Typecheck, lint and test. Used by ci.yml and before every production deploy.
on:
  workflow_call:
    inputs:
      coverage:
        description: Measure coverage and keep the README badge (main CI only).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    # Every job runs on the self-hosted nexus-runner, pull requests from forks
    # too. Its runners are ephemeral (ARC): each job gets a fresh pod, so a
    # job can't leave anything behind for a later one, such as a deploy.
    # A pull request can change the workflow files, so before approving a run
    # from an outside contributor, check that it doesn't touch .github/. The
    # repo requires approval for runs from all outside contributors.
    runs-on: nexus-runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GitHub token in .git/config while package install
          # scripts run.
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Generated Worker types are up to date
        run: bun run typegen:check

      - run: bun run typecheck

      - run: bun run lint

      # `bun run test` runs Vitest. `bun test` would run Bun's own test runner.
      # The production deploy gate runs the plain tests, without instrumentation.
      - if: ${{ !inputs.coverage }}
        run: bun run test

      # The same tests with coverage, then the badge file for ci.yml to publish.
      - if: ${{ inputs.coverage }}
        run: bun run test:coverage && bun run coverage:badge

      - if: ${{ inputs.coverage }}
        name: Keep the coverage badge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: coverage/badge.json
          if-no-files-found: error
          retention-days: 7
