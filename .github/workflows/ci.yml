name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Every job runs on the self-hosted runner, pull requests from forks too.
    # A pull request can change this file, so before approving a run from an
    # outside contributor, check that it doesn't touch .github/.
    # The repo requires approval for runs from all outside contributors.
    runs-on: nexus-runner
    timeout-minutes: 15
    steps:
      # Pinned to commits, not tags: a moved tag would run new code on our runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GitHub token in .git/config while npm install
          # scripts run.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generated Worker types are up to date
        run: npx wrangler types --check

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
