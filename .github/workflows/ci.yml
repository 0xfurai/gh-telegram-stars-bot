name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # Every push to main goes to staging; production is deployed by hand
  # (deploy-production.yml).
  deploy-staging:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  # The README's coverage badge: shields.io reads coverage.json from the
  # "badges" branch. Only pushes to main update it, so pull requests can't.
  coverage-badge:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: nexus-runner
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout here, so no .nvmrc: keep this in step with it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-summary

      - name: Publish the badge to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const pct = require("./coverage-summary.json").total.lines.pct;
            const color = pct >= 90 ? "brightgreen" : pct >= 80 ? "green" : pct >= 70 ? "yellowgreen" : pct >= 60 ? "yellow" : "red";
            const badge = { schemaVersion: 1, label: "coverage", message: `${pct.toFixed(1)}%`, color };
            require("fs").writeFileSync("coverage.json", JSON.stringify(badge) + "\n");
            console.log(badge.message);
          '
          git init -q -b badges badges
          mv coverage.json badges/
          cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "Coverage badge for ${GITHUB_SHA}"
          # One commit, force-pushed: the branch holds only the latest badge.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
