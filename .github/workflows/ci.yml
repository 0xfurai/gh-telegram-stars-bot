name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Our own branches run on the self-hosted runner. Pull requests from forks
    # run on GitHub-hosted runners, so untrusted code never runs on our machine.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'nexus-runner' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generated Worker types are up to date
        run: npx wrangler types --check

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
